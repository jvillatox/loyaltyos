name: Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - infra/docker/**
      - .github/workflows/smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Create .env.production
        run: |
          cp infra/docker/.env.production.example infra/docker/.env.production
          echo "JWT_SECRET=$(openssl rand -hex 64)" >> infra/docker/.env.production
          echo "API_KEY_SALT=$(openssl rand -hex 32)" >> infra/docker/.env.production
          echo "KMS_MASTER_KEY=$(openssl rand -hex 32)" >> infra/docker/.env.production
          echo "GIFTCARD_HMAC_SECRET=$(openssl rand -hex 32)" >> infra/docker/.env.production
          echo "METRICS_TOKEN=$(openssl rand -hex 32)" >> infra/docker/.env.production

      - name: Start services
        run: |
          docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env.production up -d --build
          # Wait for the API to finish `prisma migrate deploy` and bind port 3002.
          # `depends_on` only gates the API on postgres/redis health; the API
          # still runs migrations before listening, so poll /healthz directly.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3002/healthz >/dev/null 2>&1; then
              echo "API ready (after ~$((i * 2))s)"
              break
            fi
            sleep 2
          done

      - name: Smoke test — API health
        run: |
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors http://localhost:3002/healthz

      - name: Smoke test — API metrics (token required)
        run: |
          # Without a bearer token, /metrics must be rejected (401)
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3002/metrics)
          test "$status" = "401"
          # With the correct bearer token, /metrics must return scrapable metrics
          METRICS_TOKEN=$(grep '^METRICS_TOKEN=' infra/docker/.env.production | cut -d= -f2-)
          curl -fsS -H "Authorization: Bearer $METRICS_TOKEN" http://localhost:3002/metrics | grep -q "loyaltyos_"

      - name: Smoke test — AI chat requires admin auth
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3002/api/v1/admin/ai/chat -H "Content-Type: application/json" -d '{"messages":[{"role":"user","content":"hi"}]}')
          test "$status" = "401"

      - name: Smoke test — Admin serves SPA
        run: |
          curl -fsS --retry 5 --retry-delay 2 http://localhost:5173/ | grep -q "<title"

      - name: Smoke test — Portal serves PWA
        run: |
          curl -fsS --retry 5 --retry-delay 2 http://localhost:5174/ | grep -q "<title"

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env.production logs --tail=200
